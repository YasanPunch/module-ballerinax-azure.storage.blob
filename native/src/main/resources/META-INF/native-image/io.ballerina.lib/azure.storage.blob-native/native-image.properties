# azure-core initializes com.azure.core.util.Configuration at build time, and its logger lookup
# binds to the slf4j JUL adapter that ballerina-rt provides, so the adapter must be built in too.
# The JDK transport's provider holds a lazily built shared client that must not be baked in.
# The storage SDK parses endpoints with java.net.URL, whose http and https handlers are off by
# default in a native image (the Netty transport jar used to enable them).
Args = --initialize-at-build-time=org.slf4j.jul.JDK14LoggerAdapter,org.slf4j.jul.JDK14LoggerAdapter$1 \
       --initialize-at-run-time=com.azure.core.http.jdk.httpclient.JdkHttpClientProvider$GlobalJdkAsyncHttpClient \
       --enable-url-protocols=http,https
